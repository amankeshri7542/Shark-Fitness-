services:
  # A disposable public demo. The free plan has no persistent disk, so the
  # database lives in /tmp and is recreated, with demo data, on every restart.
  # Real gyms need a persistent-disk host and SHARK_SEED_DEMO=false; see
  # shark-fitness/docs/deployment-stabilization.md.
  - type: web
    name: shark-fitness-demo
    runtime: docker
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SHARK_SERVE_STATIC
        value: "true"
      - key: SHARK_DB
        value: /tmp/shark-fitness/shark.db
      - key: SHARK_SEED_DEMO
        value: "true"
      - key: SHARK_PASS_SECRET
        # At least 48 bytes; Render's generated 256-bit value is only 44 base64 characters.
        sync: false
      - key: SHARK_ECHO_OTP
        value: "false"
      - key: SHARK_ALLOW_BEARER_AUTH
        value: "false"
      # Render is the single reverse-proxy hop in front of this service.
      - key: SHARK_TRUST_PROXY_HOPS
        value: "1"
