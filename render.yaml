services:
  - type: web
    name: shark-fitness-demo
    runtime: docker
    branch: main
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    disk:
      name: shark-data
      mountPath: /var/lib/shark-fitness
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SHARK_SERVE_STATIC
        value: "true"
      - key: SHARK_DB
        value: /var/lib/shark-fitness/shark.db
      - key: SHARK_SEED_DEMO
        value: "false"
      - key: SHARK_PASS_SECRET
        # At least 48 bytes; Render's generated 256-bit value is only 44 base64 characters.
        sync: false
      - key: SHARK_ECHO_OTP
        value: "false"
      - key: SHARK_ALLOW_BEARER_AUTH
        value: "false"
      # Render is the single reverse-proxy hop in front of this service.
      - key: SHARK_TRUST_PROXY_HOPS
        value: "1"
