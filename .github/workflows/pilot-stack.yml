name: Pilot stack

# Runs deploy/pilot end to end on a runner, the way the pilot server uses it:
# provision (app part), deploy behind Caddy, bootstrap an empty gym, the owner
# signs in, the nightly backup unit, a restore drill, encrypted off-site copies
# (an rclone local remote and a throwaway age key) with a drill from them and a
# forced upload failure, and a redeploy that must keep the gym. Only when those
# scripts or what they call change.
on:
  pull_request:
    paths:
      - deploy/pilot/**
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/pilot-stack.yml
      - shark-fitness/apps/api/src/db/**
      - shark-fitness/scripts/sqlite-backup.mjs
      - shark-fitness/scripts/verify-backup-restore.mjs
      # What the app reads at boot from shark.env, which now carries the
      # off-site backup settings too.
      - shark-fitness/apps/api/src/lib/config.ts
      - shark-fitness/apps/api/src/server.ts
  push:
    branches: [main]
    paths:
      - deploy/pilot/**
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/pilot-stack.yml
      - shark-fitness/apps/api/src/db/**
      - shark-fitness/scripts/sqlite-backup.mjs
      - shark-fitness/scripts/verify-backup-restore.mjs
      # What the app reads at boot from shark.env, which now carries the
      # off-site backup settings too.
      - shark-fitness/apps/api/src/lib/config.ts
      - shark-fitness/apps/api/src/server.ts

permissions:
  contents: read

concurrency:
  group: pilot-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PILOT: /srv/shark-fitness/src/deploy/pilot
      # A throwaway gym on a throwaway runner; not a secret.
      OWNER_EMAIL: owner@pilot-ci.example
      OWNER_PASSWORD: pilot-ci-owner-password-not-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint the scripts
        run: shellcheck -S warning deploy/pilot/*.sh

      - name: Provision the app part
        run: |
          # The checkout under test stands in for provision.sh's clone. Root
          # owns it, as on the server, so git run by root accepts it.
          sudo install -d /srv/shark-fitness
          sudo cp -r "$GITHUB_WORKSPACE" /srv/shark-fitness/src
          sudo bash "$PILOT/provision.sh" --skip-system localhost
          sudo grep -Eq '^SHARK_PASS_SECRET=.{64}$' /srv/shark-fitness/shark.env
          sudo grep -Eq '^SHARK_MFA_ENCRYPTION_KEY=.{44}$' /srv/shark-fitness/shark.env
          test "$(sudo stat -c %a /srv/shark-fitness/shark.env)" = 600
          systemctl is-enabled shark-backup.timer

      - name: Deploy
        run: sudo "$PILOT/deploy.sh" --current

      - name: Serves HTTPS through Caddy
        run: |
          # Captured first: under pipefail, grep -q quitting early can fail curl.
          ready=$(curl -fsSk https://localhost/ready)
          echo "$ready"
          [[ $ready == *'"status":"ready"'* ]]
          [[ $(curl -fsSk https://localhost/admin/) == *'<html'* ]]
          [[ $(curl -fsSk https://localhost/) == *'<html'* ]]
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ready)" = 308
          [[ $(curl -fsSk -o /dev/null -D - https://localhost/ready) == *[Ss]trict-[Tt]ransport-[Ss]ecurity:* ]]

      - name: Bootstrap an empty gym
        run: |
          printf '%s' "{\"slug\":\"pilot-ci\",\"legalName\":\"Pilot CI Gym Pvt Ltd\",\"displayName\":\"Pilot CI Gym\",\"timezone\":\"Asia/Kolkata\",\"owner\":{\"name\":\"CI Owner\",\"email\":\"$OWNER_EMAIL\",\"password\":\"$OWNER_PASSWORD\"},\"branch\":{\"name\":\"Main\",\"slug\":\"main\",\"addressLine\":\"1 Test Road\",\"city\":\"Bengaluru\",\"capacity\":60,\"opensMinutes\":360,\"closesMinutes\":1320}}" \
            | sudo "$PILOT/bootstrap.sh"
          # The same gym code again is refused, not overwritten.
          if printf '%s' "{\"slug\":\"pilot-ci\",\"legalName\":\"X\",\"displayName\":\"X\",\"timezone\":\"Asia/Kolkata\",\"owner\":{\"name\":\"X\",\"email\":\"x@pilot-ci.example\",\"password\":\"another-password-123\"},\"branch\":{\"name\":\"Main\",\"slug\":\"main\",\"addressLine\":\"1\",\"city\":\"X\",\"capacity\":1,\"opensMinutes\":360,\"closesMinutes\":1320}}" \
            | sudo "$PILOT/bootstrap.sh"; then
            echo "A duplicate gym code was accepted." >&2
            exit 1
          fi

      - name: The owner signs in to an empty gym
        run: |
          jar=$(mktemp)
          curl -fsSk -c "$jar" -H 'origin: https://localhost' -H 'content-type: application/json' \
            -d "{\"tenantSlug\":\"pilot-ci\",\"email\":\"$OWNER_EMAIL\",\"password\":\"$OWNER_PASSWORD\"}" \
            https://localhost/v1/auth/password -o /dev/null
          curl -fsSk -b "$jar" -H 'origin: https://localhost' https://localhost/v1/admin/dashboard -o /dev/null
          cd "$PILOT"
          sudo docker compose exec -T app node -e '
            const D = require("./apps/api/node_modules/better-sqlite3");
            const db = new D(process.env.SHARK_DB, { readonly: true });
            const count = (t) => db.prepare("select count(*) from " + t).pluck().get();
            const counts = { tenants: count("tenants"), users: count("users"), members: count("members"), invoices: count("invoices") };
            console.log(counts);
            if (counts.tenants !== 1 || counts.users !== 1 || counts.members !== 0 || counts.invoices !== 0) process.exit(1);
          '

      - name: Nightly backup unit
        run: |
          sudo systemctl start shark-backup.service
          log=$(sudo journalctl -u shark-backup --no-pager -o cat)
          echo "$log"
          grep -qx 'restore_probe=ok' <<<"$log"
          # Off-site copies are off until configured, and say so.
          grep -qx 'offsite=skipped' <<<"$log"
          sudo sh -c 'ls -l /srv/shark-fitness/backups/nightly/shark-*.db /srv/shark-fitness/backups/nightly/shark-*.db.manifest.json'
          systemctl list-timers shark-backup.timer --no-pager

      - name: Restore drill from a copy brought back to the server
        run: |
          backup=$(sudo sh -c 'ls -1t /srv/shark-fitness/backups/nightly/shark-*.db | head -n 1')
          sudo cp "$backup" "$backup.manifest.json" /srv/shark-fitness/drill/inbox/
          printf '%s\n' "$OWNER_PASSWORD" \
            | sudo "$PILOT/restore-drill.sh" --gym pilot-ci --email "$OWNER_EMAIL" "/srv/shark-fitness/drill/inbox/$(basename "$backup")" \
            | tee drill.log
          grep -q '^synthetic_proof=passed' drill.log
          grep -q '^owner_sign_in=200$' drill.log
          grep -q '^members=0$' drill.log
          grep -q '^drill=passed' drill.log
          # The drill copy is gone afterwards; the live database is untouched.
          test -z "$(sudo find /srv/shark-fitness/drill -mindepth 1 -maxdepth 1 -type d -name '20*')"
          curl -fsSk https://localhost/ready -o /dev/null

      - name: Encrypted off-site backup through the nightly unit
        run: |
          # provision.sh --skip-system leaves out system packages; on a server
          # provision.sh installs these two.
          sudo apt-get install -yq age rclone >/dev/null
          # A throwaway key pair. The identity (private key) stays in the
          # runner's temp dir, the way it stays off the pilot server.
          age-keygen -o "$RUNNER_TEMP/offsite-identity.txt" 2>/dev/null
          recipient=$(age-keygen -y "$RUNNER_TEMP/offsite-identity.txt")
          sudo rclone config create offsite local >/dev/null
          sudo install -d -m 700 /srv/offsite-ci
          # healthchecks.io stand-in: records each ping's path and last line.
          cat > "$RUNNER_TEMP/ping.py" <<'EOF'
          import http.server, sys
          class Ping(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('content-length') or 0)).decode()
                  with open(sys.argv[2], 'a') as log:
                      log.write(f"{self.path} {(body.splitlines() or [''])[-1]}\n")
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), Ping).serve_forever()
          EOF
          nohup python3 "$RUNNER_TEMP/ping.py" 18999 "$RUNNER_TEMP/pings.log" >/dev/null 2>&1 &
          printf 'SHARK_BACKUP_PING_URL=http://127.0.0.1:18999/ci\nSHARK_BACKUP_OFFSITE_REMOTE=offsite:/srv/offsite-ci\nSHARK_BACKUP_AGE_RECIPIENT=%s\nSHARK_BACKUP_OFFSITE_KEEP_DAYS=30\n' "$recipient" \
            | sudo tee -a /srv/shark-fitness/shark.env >/dev/null

          cursor=$(sudo journalctl -u shark-backup -n 0 --show-cursor --no-pager | sed -n 's/^-- cursor: //p')
          sudo systemctl start shark-backup.service
          log=$(sudo journalctl -u shark-backup --no-pager -o cat --after-cursor "$cursor")
          echo "$log"
          grep -qx 'offsite=uploaded' <<<"$log"
          object=$(sed -n 's/^offsite_object=//p' <<<"$log")
          echo "OFFSITE_OBJECT=$object" >> "$GITHUB_ENV"
          sudo sh -c 'ls -l /srv/offsite-ci/nightly/shark-*.db.age /srv/offsite-ci/nightly/shark-*.db.manifest.json.age'
          # What left the server is ciphertext, not SQLite. (`! cmd` cannot
          # fail a step under bash -e, hence the if.)
          if sudo sh -c 'cat /srv/offsite-ci/nightly/shark-*.db.age' | grep -aq 'SQLite format'; then
            echo "An off-site copy is not encrypted." >&2
            exit 1
          fi
          grep -q '^/ci offsite=uploaded$' "$RUNNER_TEMP/pings.log"

      - name: Restore drill from the encrypted off-site copy
        run: |
          printf '%s\n' "$OWNER_PASSWORD" \
            | sudo "$PILOT/restore-drill.sh" --skip-synthetic --gym pilot-ci --email "$OWNER_EMAIL" \
                --from-offsite "$OFFSITE_OBJECT" --age-identity "$RUNNER_TEMP/offsite-identity.txt" \
            | tee offsite-drill.log
          grep -q '^offsite_download=verified' offsite-drill.log
          grep -q '^owner_sign_in=200$' offsite-drill.log
          grep -q '^drill=passed' offsite-drill.log
          # No decrypted copy is left behind.
          test -z "$(sudo find /srv/shark-fitness/drill -name 'shark-*.db*')"

      - name: A failed off-site upload keeps local copies and pings /fail
        run: |
          # An unreachable remote: nothing listens on port 9.
          sudo rclone config create down webdav url http://127.0.0.1:9 vendor other >/dev/null
          sudo sed -i 's|^SHARK_BACKUP_OFFSITE_REMOTE=.*|SHARK_BACKUP_OFFSITE_REMOTE=down:shark|' /srv/shark-fitness/shark.env
          before=$(sudo sh -c 'ls /srv/shark-fitness/backups/nightly/shark-*.db | wc -l')
          : > "$RUNNER_TEMP/pings.log"
          # The default run shell has no pipefail; this pipeline must fail
          # when backup.sh does.
          set -o pipefail
          if sudo "$PILOT/backup.sh" nightly | tee failed.log; then
            echo "A nightly run with a failed upload exited 0." >&2
            exit 1
          fi
          grep -qx 'offsite=failed' failed.log
          after=$(sudo sh -c 'ls /srv/shark-fitness/backups/nightly/shark-*.db | wc -l')
          test "$after" -eq $((before + 1))
          grep -q '^/ci/fail offsite=failed$' "$RUNNER_TEMP/pings.log"
          sudo sed -i 's|^SHARK_BACKUP_OFFSITE_REMOTE=.*|SHARK_BACKUP_OFFSITE_REMOTE=offsite:/srv/offsite-ci|' /srv/shark-fitness/shark.env

      - name: A redeploy backs up first and keeps the gym
        run: |
          sudo "$PILOT/deploy.sh" --current
          sudo sh -c 'ls /srv/shark-fitness/backups/pre-deploy/shark-*.db'
          # Pre-deploy copies go off-site too.
          sudo sh -c 'ls /srv/offsite-ci/pre-deploy/shark-*.db.age'
          curl -fsSk -H 'origin: https://localhost' -H 'content-type: application/json' \
            -d "{\"tenantSlug\":\"pilot-ci\",\"email\":\"$OWNER_EMAIL\",\"password\":\"$OWNER_PASSWORD\"}" \
            https://localhost/v1/auth/password -o /dev/null

      - name: A replaced container keeps the gym
        run: |
          # The same commit redeployed leaves the container alone, so force a
          # new one onto the same data directory.
          cd "$PILOT"
          sudo docker compose up -d --force-recreate
          for _ in $(seq 1 60); do curl -fsSk https://localhost/ready -o /dev/null && break; sleep 2; done
          curl -fsSk -H 'origin: https://localhost' -H 'content-type: application/json' \
            -d "{\"tenantSlug\":\"pilot-ci\",\"email\":\"$OWNER_EMAIL\",\"password\":\"$OWNER_PASSWORD\"}" \
            https://localhost/v1/auth/password -o /dev/null

      - name: Logs on failure
        if: failure()
        run: |
          cd "$PILOT" && sudo docker compose logs --tail 200 || true
          sudo journalctl -u shark-backup --no-pager || true
          cat "$RUNNER_TEMP/pings.log" 2>/dev/null || true
