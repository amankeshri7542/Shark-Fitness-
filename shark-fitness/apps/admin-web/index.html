<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04080b" />
    <title>Shark Fitness — Operations</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The member PWA owns a root-scoped service worker because it must support
      // offline member routes. Admin is a separate SPA on the same origin. Ask
      // an older root worker to update before booting Admin, and reload once if
      // a newly activated worker takes control. This lets existing demo browsers
      // recover without asking a reviewer to clear site data manually.
      (() => {
        if (!('serviceWorker' in navigator)) return;
        const reloadKey = 'shark.admin.sw-recovered';
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (sessionStorage.getItem(reloadKey)) return;
          sessionStorage.setItem(reloadKey, '1');
          location.reload();
        });
        navigator.serviceWorker
          .getRegistrations()
          .then((registrations) =>
            Promise.all(
              registrations
                .filter((registration) => {
                  const scope = new URL(registration.scope);
                  return scope.origin === location.origin && scope.pathname === '/';
                })
                .map((registration) => registration.update().catch(() => undefined)),
            ),
          )
          .catch(() => undefined);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
