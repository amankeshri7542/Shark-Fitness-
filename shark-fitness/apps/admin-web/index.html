<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04080b" />
    <title>Shark Fitness — Operations</title>
    <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/admin/icons/apple-touch-icon-180.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shark Ops" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The member PWA owns a root-scoped service worker because it must support
      // offline member routes. Admin is a separate SPA on the same origin. Ask
      // an older root worker to update before booting Admin, and reload once if
      // a newly activated worker takes control. This lets existing demo browsers
      // recover without asking a reviewer to clear site data manually.
      (() => {
        if (!('serviceWorker' in navigator)) return;
        const reloadKey = 'shark.admin.sw-recovered';
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // The console's own worker (/admin/sw.js) taking over is expected
          // and needs no reload; only a foreign root worker does.
          var controller = navigator.serviceWorker.controller;
          if (controller && new URL(controller.scriptURL).pathname === '/admin/sw.js') return;
          if (sessionStorage.getItem(reloadKey)) return;
          sessionStorage.setItem(reloadKey, '1');
          location.reload();
        });
        navigator.serviceWorker
          .getRegistrations()
          .then((registrations) =>
            Promise.all(
              registrations
                .filter((registration) => {
                  const scope = new URL(registration.scope);
                  return scope.origin === location.origin && scope.pathname === '/';
                })
                .map((registration) => registration.update().catch(() => undefined)),
            ),
          )
          .catch(() => undefined);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
