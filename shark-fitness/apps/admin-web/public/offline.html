<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04080b" />
    <title>Offline · Shark Fitness console</title>
    <style>
      /* Self-contained: served by the console's worker when the network is down. */
      :root { color-scheme: dark; --bg: #04080b; --ink: #e8f1f5; --soft: rgba(232, 241, 245, 0.65); --line: rgba(120, 190, 215, 0.3); --accent: #46c8dd; --on-accent: #04080b; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #eef2f4; --ink: #0b1a22; --soft: rgba(11, 26, 34, 0.68); --line: rgba(45, 90, 110, 0.34); --accent: #0a6d81; --on-accent: #ffffff; }
      }
      * { box-sizing: border-box; border-radius: 0; }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 15px/1.45 Archivo, system-ui, -apple-system, sans-serif; }
      main { max-width: 460px; width: 100%; border: 1px solid var(--line); padding: 28px 24px; }
      .mark { display: block; width: 40px; height: 40px; color: var(--accent); }
      h1 { margin: 18px 0 8px; font: 400 30px/0.96 Anton, "Arial Narrow", system-ui, sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: var(--soft); }
      button { min-height: 44px; width: 100%; border: 0; cursor: pointer; padding: 12px 16px; background: var(--accent); color: var(--on-accent); font: 400 16px "Archivo Narrow", "Arial Narrow", system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 100% 72%, calc(100% - 14px) 100%, 0 100%); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M8 62 L50 12 L92 62 L50 46 Z" fill="currentColor" />
        <rect x="8" y="76" width="84" height="7" fill="currentColor" opacity="0.55" />
      </svg>
      <h1>You're offline</h1>
      <p>You're offline. The console needs a connection to show live data. Check the reception Wi-Fi or mobile data, then try again. Members can still be checked in by hand and entered once you're back online.</p>
      <!-- A plain form, not an onclick handler: the Content-Security-Policy allows
           no inline event handlers. Submitting it loads this address again. -->
      <form method="get"><button type="submit">Try again</button></form>
    </main>
  </body>
</html>
